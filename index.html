meta[r.o+'/'+r.r]={stars:data.stargazers_count||0,forks:data.forks_count||0,pushed:data.pushed_at||'',branch:data.default_branch||'main',desc:data.description||''};
}catch(e){meta[r.o+'/'+r.r]=meta[r.o+'/'+r.r]||{stars:0,forks:0,pushed:'',branch:'main',desc:''};}
}
renderRepos();
}
function repoKey(r){return r.o+'/'+r.r;}
function renderRepos(){
let stars=0;
document.getElementById('repoGrid').innerHTML=REPOS.map(r=>{const m=meta[repoKey(r)]||{};stars+=m.stars||0;
const idx=INDEX[repoKey(r)];
return `<div class="card"><h3><a target="_blank" rel="noopener" href="${r.u}">${r.o}/${r.r}</a></h3><div><span class="pill">${r.kind}</span>${idx?`<span class="pill g">${idx.files.length} ${t('indexedL')}</span>`:''}</div><div class="meta">★ <b>${(m.stars||0).toLocaleString('en-US')}</b> · forks ${(m.forks||0).toLocaleString('en-US')}<br>${t('updatedL')}: ${m.pushed?m.pushed.slice(0,10):'—'} · ${(m.desc||'').slice(0,90)}</div><div class="row"><button class="alt sm" style="padding:6px 12px;font-size:12px" onclick="indexRepo('${r.o}','${r.r}')">${t('indexedL')} ⚡</button><a target="_blank" rel="noopener" style="color:var(--blu);font-size:12.5px" href="${r.u}">${t('openB')}</a></div><div class="prog" id="pg-${r.o}-${r.r}" style="display:none"><div></div></div></div>`;}).join('');
document.getElementById('stStars').textContent=stars?stars.toLocaleString('en-US'):'—';
const tot=Object.keys(INDEX).reduce((s,k)=>s+INDEX[k].files.length,0);
document.getElementById('stFiles').textContent=tot?tot.toLocaleString('en-US'):'—';
}
let INDEX={};
function isRule(p){return /\.(yar|yara|sigma|yml|yaml)$/i.test(p);}
async function indexRepo(o,r){
const k=o+'/'+r,bar=document.getElementById('pg-'+o+'-'+r);
try{
if(bar){bar.style.display='block';bar.firstChild.style.width='20%';}
const m=meta[k]||{branch:'main'};
const {data,quota}=await gh('/repos/'+o+'/'+r+'/git/trees/'+(m.branch||'main')+'?recursive=1');
showQuota(quota);
if(bar)bar.firstChild.style.width='70%';
const files=(data.tree||[]).filter(x=>x.type==='blob'&&isRule(x.path)).map(x=>({p:x.path,s:x.size||0,sha:x.sha}));
INDEX[k]={files,at:Date.now()};
if(bar)bar.firstChild.style.width='100%';
renderRepos();renderSearch();toast(files.length+' ✓');
setTimeout(()=>{if(bar)bar.style.display='none';},800);
}catch(e){toast(t('nodata'));if(bar)bar.style.display='none';}
}
function renderSearch(){
const q=document.getElementById('qS').value.trim().toLowerCase();
const kind=document.getElementById('fKind').value;
const all=[];
Object.keys(INDEX).forEach(k=>{INDEX[k].files.forEach(f=>{const rk=REPOS.find(x=>repoKey(x)===k);all.push({repo:k,path:f.p,kind:rk?rk.kind:'?',size:f.s,sha:f.sha});});});
const list=all.filter(f=>(!kind||f.kind===kind)&&(!q||f.path.toLowerCase().includes(q))).slice(0,150);
const kinds=[...new Set(Object.keys(INDEX).map(k=>{const r=REPOS.find(x=>repoKey(x)===k);return r?r.kind:'?';}))];
const fs=document.getElementById('fKind');
if(!fs.options.length)fs.innerHTML='<option value="">ALL</option>'+kinds.map(x=>`<option>${x}</option>`).join('');
document.getElementById('idxLine').textContent=Object.keys(INDEX).length+' repos · '+all.length+' files';
document.getElementById('searchGrid').innerHTML=list.map((f,i)=>`<div class="card"><h3 style="font-size:13px;direction:ltr;text-align:left">${esc(f.path.split('/').pop())}</h3><div><span class="pill">${f.kind}</span></div><div class="meta" dir="ltr">${esc(f.repo)}<br>${esc(f.path).slice(0,80)}</div><div class="row"><button class="alt sm" style="padding:6px 12px;font-size:12px" onclick="viewFile('${f.repo}','${esc(f.path)}'.replace(/&amp;/g,'&'))">${t('viewB')}</button></div></div>`).join('');
}
async function viewFile(repo,path){
const [o,r]=repo.split('/');const m=meta[repo]||{branch:'main'};
const box=document.getElementById('fileView');box.innerHTML='<p style="color:var(--mut)">…</p>';
box.scrollIntoView({behavior:'smooth',block:'nearest'});
try{
const res=await fetch('https://raw.githubusercontent.com/'+o+'/'+r+'/'+(m.branch||'main')+'/'+path.split('/').map(encodeURIComponent).join('/'));
if(!res.ok)throw 0;const txt=(await res.text()).slice(0,60000);
const chk=validateRule(path,txt);
box.innerHTML=`<h3 style="direction:ltr">${esc(path.split('/').pop())} <small style="color:var(--mut)">${repo}</small></h3><div class="note">${t('valT')}: ${chk.ok?'✅ '+t('okV'):'⚠️ '+t('warnV')} — ${esc(chk.msg)}</div><pre class="view">${esc(txt.slice(0,12000))}</pre><div class="row"><button class="alt" onclick="copyTxt2(this)" data-t="${encodeURIComponent(txt.slice(0,60000))}">${t('copyB')}</button><a class="alt" style="text-decoration:none" target="_blank" rel="noopener" href="https://raw.githubusercontent.com/${o}/${r}/${m.branch||'main'}/${path.split('/').map(encodeURIComponent).join('/')}">${t('dlB')}</a></div>`;
}catch(e){box.innerHTML='<p style="color:var(--mut)">'+t('nodata')+'</p>';}
}
function copyTxt2(el){try{const s=decodeURIComponent(el.getAttribute('data-t'));if(navigator.clipboard)navigator.clipboard.writeText(s);}catch(e){}toast(t('copied'));}
function validateRule(path,txt){
const low=path.toLowerCase();
if(/\.yara?$/.test(low)){const hasR=/^\s*rule\s+\w+/m.test(txt),hasS=/strings\s*:/.test(txt),hasC=/condition\s*:/.test(txt);
return {ok:hasR&&hasS&&hasC,msg:'rule/strings:/condition:'};}
if(/\.sigma$/.test(low)||/sigma/.test(low)){const ok=/title\s*:/.test(txt)&&/logsource\s*:/.test(txt)&&/detection\s*:/.test(txt);return {ok,msg:'title/logsource/detection'};}
if(/\.ya?ml$/.test(low)){const ok=/\bid\s*:/.test(txt)&&/info\s*:/.test(txt);return {ok,msg:'id/info (+requests)'};}
return {ok:/id\s*:/.test(txt),msg:'id field'};
}
async function loadUpdates(silent){
const box=document.getElementById('updList');
try{
let all=[];
for(const r of REPOS){
try{const {data}=await gh('/repos/'+r.o+'/'+r.r+'/commits?per_page=5');(data||[]).forEach(c=>all.push({repo:repoKey(r),msg:(c.commit||{}).message||'',date:((c.commit||{}).author||{}).date||'',url:c.html_url||r.u}));}catch(e){}
}
all.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const seen=sGet('rh_seen',[]);
const fresh=all.filter(c=>seen.indexOf(c.sha||c.url)<0);
if(fresh.length){const hits=all.filter(c=>{const s=(c.msg||'').toLowerCase();return watch().some(w=>s.includes(w.toLowerCase()));});
if(hits.length)notify('RuleHunt: '+hits.length+' update(s)',hits.slice(0,3).map(c=>c.repo).join(', '));}
sSet('rh_seen',all.map(c=>c.sha||c.url).slice(0,120));
box.innerHTML=all.slice(0,40).map(c=>`<div class="card"><b>${esc(c.repo)}</b><p>${esc(c.msg.split('\n')[0]).slice(0,160)}</p><small>${esc((c.date||'').slice(0,10))} · <a target="_blank" rel="noopener" style="color:var(--blu)" href="${c.url}">commit ↗</a></small></div>`).join('');
document.getElementById('updLine').textContent='✓ '+new Date().toLocaleTimeString();
}catch(e){if(!silent)toast(t('nodata'));}
}
function watch(){return sGet('rh_watch',[]);} function setWatch(w){sSet('rh_watch',w);}
function wAdd(){const v=document.getElementById('wIn').value.trim();if(v.length<2){toast(t('needKw'));return;}
const w=watch();if(w.map(x=>x.toLowerCase()).indexOf(v.toLowerCase())>=0){toast(t('dup'));return;}
w.push(v);setWatch(w);renderW();toast(t('added'));}
function wDel(i){const w=watch();w.splice(i,1);setWatch(w);renderW();}
function renderW(){const w=watch();document.getElementById('wList').innerHTML=w.map((x,i)=>`<div class="note" style="display:flex;gap:8px;align-items:center"><span style="flex:1">${esc(x)}</span><button onclick="wDel(${i})" style="background:none;border:none;cursor:pointer">❌</button></div>`).join('');}
function notify(ti,bo){try{if('Notification' in window&&Notification.permission==='granted')new Notification(ti,{body:String(bo).slice(0,140)});}catch(e){}}
function enableNotif(){try{if(!('Notification' in window)){toast(t('permOff'));return;}Notification.requestPermission().then(p=>toast(p==='granted'?t('permOn'):t('permOff')));}catch(e){toast(t('permOff'));}}
function testNotif(){notify(t('testT'),t('testB'));}
function proJoin(){try{const L=sGet('rh_pro',[]);L.unshift({time:new Date().toLocaleString()});sSet('rh_pro',L);}catch(e){}try{tgSend('⭐ RuleHunt PRO interest');}catch(e){}toast(t('joined'));}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
function renderPay(){const el=document.getElementById('payBox');if(!el)return;const P=CONFIG.pay;
const row=(l,v)=>`<div style="margin:6px 0"><b>${l}:</b> <code style="direction:ltr">${v}</code> <button class="alt sm" style="padding:4px 12px;font-size:12px" onclick="copyTxt('${v.replace(/ /g,'')}')">${t('copyB')}</button></div>`;
el.innerHTML=`<b>${t('payT2')}</b>`+row('₿ BTC',P.btc)+row('₮ USDT-TRC20',P.usdt)+row('🏦 '+P.name+' TRY',P.try)+row('🏦 '+P.name+' USD',P.usd);}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setInterval(()=>loadUpdates(true),1800000);
setLang('en');loadAds();renderPay();renderW();loadRepos();
</script>
</body>
